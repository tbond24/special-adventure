name: First listing publication contract
on:
  push:
    branches: ['codespaces/**', 'feature/codespaces-**']
    paths: ['supabase/migrations/*admin_listing_first_publication.sql', 'supabase/rollback/admin_listing_first_publication_20261027.sql', 'tests/admin-listing-publication-sql.check.mjs', 'tests/fixtures/admin-listing-publication-baseline.json', '.github/workflows/admin-listing-publication.yml']
  pull_request:
    paths: ['supabase/migrations/*admin_listing_first_publication.sql', 'supabase/rollback/admin_listing_first_publication_20261027.sql', 'tests/admin-listing-publication-sql.check.mjs', 'tests/fixtures/admin-listing-publication-baseline.json', '.github/workflows/admin-listing-publication.yml']
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/vacancy-publication-sql" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.12
      - run: node tests/admin-listing-publication-sql.check.mjs
        env:
          VACANCY_PGLITE_MODULE: ${{ runner.temp }}/vacancy-publication-sql/node_modules/@electric-sql/pglite/dist/index.js
