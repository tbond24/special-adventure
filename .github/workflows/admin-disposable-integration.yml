name: Vacancy Disposable Auth and Frontend Integration
on:
  push:
    branches: [feature/admin-desktop-editor-20261014]
    paths:
      - 'tests/full-stack/**'
      - 'tests/hosted-admin/frontend-server*'
      - '.github/workflows/admin-disposable-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vacancy-disposable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VACANCY_DISPOSABLE_STACK: '1'
      VACANCY_FREE_RECOVERY_DRILL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout currently deployed production SHA for rollback compatibility proof
        uses: actions/checkout@v4
        with:
          ref: 1a03a32592892a05ee0bdebbc33b75e409d7392e
          path: work/deployed-baseline
          persist-credentials: false
      - name: Read the preserved feature source for reconciliation provenance
        uses: actions/checkout@v4
        with:
          ref: a9c6303d6a80cd93d8ca1566cc0d459fbe77a87a
          path: work/reconciliation-reference
          persist-credentials: false
      - name: Read the five newer feature commits without changing either source branch
        uses: actions/checkout@v4
        with:
          ref: 0a5d4d826277a60131e9a5e301bb9cff7633f722
          path: work/reconciliation-latest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: npm ci --ignore-scripts
      - name: Check both source histories and all preserved migration contracts
        run: node tests/full-stack/reconciliation-source-check.mjs --check --record
      - run: npx playwright install --with-deps chromium
      - name: Real Auth, editor, customer photos and password-reset service
        run: node tests/full-stack/run-recovery.mjs
      - name: Remove this disposable stack and its data even after interruption
        if: always()
        run: supabase stop --project-id vacancy-disposable-admin --no-backup --yes >/dev/null 2>&1
      - name: Native 200 percent Chromium zoom on the isolated editor
        run: node tests/admin-native-zoom.cjs
      - name: Retain sanitized evidence only (no traces, sessions, logs or key files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacancy-disposable-integration
          path: |
            work/full-stack-evidence/*.json
            work/full-stack-evidence/*.png
          retention-days: 7
          if-no-files-found: error
