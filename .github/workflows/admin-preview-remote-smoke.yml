name: Vacancy Isolated Vercel Preview Smoke
on:
  push:
    branches: [preview/admin-editor-synthetic-isolated-20261015]
    paths:
      - '.github/workflows/admin-preview-remote-smoke.yml'
      - '.github/scripts/admin-preview-remote-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vacancy-preview-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  online-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VACANCY_TEST_PREVIEW_A: https://vacancy-jopsp1vt1-tbond24s-projects.vercel.app
      VACANCY_TEST_PREVIEW_B: https://vacancy-qmsptv3ba-tbond24s-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check remotely deployed CSP, blocked API, synthetic admin visual behavior
        run: node .github/scripts/admin-preview-remote-smoke.mjs
      - name: Upload synthetic screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacancy-isolated-vercel-preview
          path: work/preview-evidence/*.png
          retention-days: 7
          if-no-files-found: ignore
