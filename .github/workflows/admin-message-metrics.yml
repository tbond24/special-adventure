name: Message metric sender breakdown
on:
  push:
    branches: ['codespaces/**', 'feature/codespaces-**']
    paths: ['supabase/migrations/*admin_message_metrics_split*.sql', 'supabase/rollback/admin_message_metrics_20261028.sql', 'tests/admin-message-metrics-sql.check.mjs', 'tests/fixtures/admin-message-metrics-baseline.json', '.github/workflows/admin-message-metrics.yml']
  pull_request:
    paths: ['supabase/migrations/*admin_message_metrics_split*.sql', 'supabase/rollback/admin_message_metrics_20261028.sql', 'tests/admin-message-metrics-sql.check.mjs', 'tests/fixtures/admin-message-metrics-baseline.json', '.github/workflows/admin-message-metrics.yml']
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/vacancy-message-metrics-sql" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.12
      - run: node tests/admin-message-metrics-sql.check.mjs
        env:
          VACANCY_PGLITE_MODULE: ${{ runner.temp }}/vacancy-message-metrics-sql/node_modules/@electric-sql/pglite/dist/index.js
