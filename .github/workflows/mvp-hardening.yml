name: Vacancy MVP Hardening

on:
  push:
    branches:
      - dev/roadmap-next-build
  workflow_dispatch:

jobs:
  hardening:
    runs-on: ubuntu-24.04
    env:
      VACANCY_E2E_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check canonical source
        run: for f in app/src/*.js; do node --check "$f"; done
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local Vacancy candidate
        run: |
          python3 -m http.server 4173 --directory app > /tmp/vacancy-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vacancy-http.log
          exit 1
      - name: Run existing production-equivalence tests
        run: npm run test:e2e
      - name: Run targeted MVP hardening tests
        run: npx playwright test tests/mvp-hardening.spec.js
