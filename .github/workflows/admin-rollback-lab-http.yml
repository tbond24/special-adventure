name: Vacancy Recovery Lab External HTTP
on:
  push:
    branches: [preview/admin-editor-synthetic-isolated-20261015]
    paths:
      - '.github/workflows/admin-rollback-lab-http.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-lab-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Assert isolated Vercel domain serves rolled-back A
        shell: bash
        run: |
          set -euo pipefail
          url="https://vacancy-admin-recovery-lab-20261015.vercel.app/"
          curl -fsSL --max-time 20 -D /tmp/recovery-head -o /tmp/recovery-body "$url"
          grep -q 'data-recovery-release="A"' /tmp/recovery-body
          grep -iq "x-vacancy-recovery-lab: isolated-static-only" /tmp/recovery-head
          grep -iq "content-security-policy:.*connect-src 'none'" /tmp/recovery-head
          grep -iq "x-robots-tag:.*noindex" /tmp/recovery-head
          if grep -Eq 'xtutkwiivqkgkqjpkxvj|sb_publishable|<script|<form' /tmp/recovery-body; then
            echo "FAILED: unsafe content detected in recovery lab" >&2
            exit 1
          fi
          echo "PASS: live lab HTTP serves rolled-back release A, restrictive headers and no live Vacancy connections"
