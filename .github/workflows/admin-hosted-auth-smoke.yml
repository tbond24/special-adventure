name: Vacancy Hosted Test Public API
on:
  push:
    branches: [feature/admin-desktop-editor-20261014]
    paths: 
      - 'tests/admin-hosted-public-smoke.mjs'
      - '.github/workflows/admin-hosted-auth-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      VACANCY_TEST_PUBLISHABLE_KEY: sb_publishable_3Q8xbRslK1eJaFjrxyS8UA_eJEqk-HA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate public API test syntax
        run: node --check tests/admin-hosted-public-smoke.mjs
      - name: Verify anonymous public vs protected PostgREST endpoints
        env:
          EXPECT_TEST_RADIUS: none
        run: node tests/admin-hosted-public-smoke.mjs
