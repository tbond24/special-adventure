name: Vacancy Auth Safety Checks
on:
  workflow_dispatch:
jobs:
  auth-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # All external calls are mocked; this job cannot send confirmation emails.
      - run: node --test tests/secure-signup.test.cjs
