name: Vacancy Admin Appearance SQL QA
on:
  push:
    branches: [feature/admin-desktop-editor-20261014]
    paths:
      - 'supabase/migrations/20261014185000_admin_roles_audit_foundation.sql'
      - 'supabase/migrations/20261014201000_protect_last_admin_owner.sql'
      - 'supabase/migrations/20261014211500_admin_appearance_editor.sql'
      - 'supabase/migrations/20261015001130_admin_appearance_conflicts_http409.sql'
      - 'tests/sql/admin_appearance_local_bootstrap.sql'
      - 'tests/sql/admin_appearance_local_test.sql'
      - '.github/workflows/admin-appearance-sql-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated_fixture_only
          POSTGRES_USER: postgres
          POSTGRES_DB: vacancy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vacancy_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: vacancy_test
      PGPASSWORD: isolated_fixture_only
    steps:
      - uses: actions/checkout@v4
      - name: Run SQL migrations in an ephemeral local PostgreSQL database
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/sql/admin_appearance_local_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261014185000_admin_roles_audit_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261014201000_protect_last_admin_owner.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261014211500_admin_appearance_editor.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015001130_admin_appearance_conflicts_http409.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/admin_appearance_local_test.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/card_services_legacy_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015105654_admin_card_services_publication.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/admin_card_services_test.sql
