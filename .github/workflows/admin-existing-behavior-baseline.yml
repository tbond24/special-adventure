name: Vacancy Existing-Behavior Baseline Diagnostic
on:
  push:
    branches: [feature/admin-desktop-editor-20261014]
    paths:
      - '.github/workflows/admin-existing-behavior-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout development tests and safe fixture server
        uses: actions/checkout@v4
      - name: Checkout verified deployed source into separate workspace
        uses: actions/checkout@v4
        with:
          ref: 1a03a32592892a05ee0bdebbc33b75e409d7392e
          path: deployed-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve ORIGINAL deployed application in an isolated loopback-only fixture
        run: |
          mv app /tmp/vacancy-candidate-app
          cp -a deployed-source/app ./app
          node tests/admin-design-fixture-server.cjs > /tmp/vacancy-baseline-fixture.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8776/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vacancy-baseline-fixture.log
          exit 1
      - name: Compare the three public-detail failures against the original commit
        env:
          VACANCY_E2E_URL: http://127.0.0.1:8776
        run: |
          npx playwright test tests/detail-quiet-experiment.spec.js \
            --project=desktop-chromium \
            --grep 'signed-in viewers do not receive|You settings can unblock|inbox shows contact context'
