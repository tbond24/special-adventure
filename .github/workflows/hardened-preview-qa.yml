name: Vacancy Hardened Preview QA
on:
  workflow_dispatch:
  push:
    branches: [dev/roadmap-next-build]
    paths:
      - 'tests/preview-adversarial.spec.js'
      - '.github/workflows/hardened-preview-qa.yml'

env:
  VACANCY_E2E_URL: https://vacancy-a4916zcur-tbond24s-projects.vercel.app

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production-equivalence gate
        run: npm run test:e2e
      - name: Run hardened regression gate
        run: npx playwright test tests/mvp-hardening.spec.js
      - name: Run adversarial persona gate
        run: npx playwright test tests/preview-adversarial.spec.js
