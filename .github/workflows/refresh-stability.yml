name: Vacancy refresh stability
on:
  push:
    branches: ['codespaces/**', 'feature/codespaces-*']
    paths: ['app/**', 'tests/refresh-stability.spec.js', 'qa/account-drafts/synthetic-cloud.cjs', 'playwright.refresh.config.cjs', 'playwright.ui.config.cjs', 'playwright.workspace.config.cjs', 'package*.json', '.github/workflows/refresh-stability.yml']
  pull_request:
    branches: [codex/vacancy-branch-reconciliation-20261016]
    paths: ['app/**', 'tests/refresh-stability.spec.js', 'qa/account-drafts/synthetic-cloud.cjs', 'playwright.refresh.config.cjs', 'playwright.ui.config.cjs', 'playwright.workspace.config.cjs', 'package*.json', '.github/workflows/refresh-stability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:refresh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vacancy-refresh-evidence
          path: |
            playwright-report/refresh/
            test-results/refresh/
          retention-days: 7
