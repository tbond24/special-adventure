<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vacancy — Rooms that are actually available</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Vacancy home">vacancy<span>.</span></a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <button data-nav="home">Find</button>
      <button data-nav="saved">Saved</button>
      <button data-nav="messages">Inbox</button>
      <button data-nav="account">You</button>
    </nav>
    <select id="marketSelect" class="market-switch" aria-label="Display currency"></select>
    <button data-nav="list" class="primary list-action">+ List a room</button>
    <button id="authButton" class="pill auth-action">Sign in</button>
  </header>
  <main id="app"></main>
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button data-nav="home"><span>⌕</span>Find</button>
    <button data-nav="saved"><span>♡</span>Saved</button>
    <button data-nav="messages"><span>◉</span>Inbox</button>
    <button data-nav="account"><span>☺</span>You</button>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="src/backend.js"></script>
  <script src="src/market-explore.js"></script>
  <script src="src/discovery.js"></script>
  <script src="src/detail-messaging.js"></script>
  <script src="src/messages-refresh.js"></script>
  <script src="src/listings.js"></script>
  <script src="src/currency-display.js"></script>
  <script src="src/recovery.js"></script>
  <script src="src/auth-account-admin.js"></script>
  <script src="src/inventory-refresh.js"></script>
</body>
</html>
